[library]
name = "@lam/vulture/ws-plugin"
version = "1.0.0"
description = "WebSocket routes and connections for @lam/vulture"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
homepage = "https://github.com/thallium-solutions/lam-vulture-ws-plugin"
repository = "https://github.com/thallium-solutions/lam-vulture-ws-plugin"

[compatibility]
lamc = "^1.17"

[dependencies]
"@lam/vulture" = { git = "https://github.com/thallium-solutions/lam-vulture.git", ref = "v1.0.0" }

[go-deps]
"github.com/gorilla/websocket" = "v1.5.3"

[scripts]
test = "python3 tests/run_tests.py"
format = "lamc fmt ."
check = "lamc fmt . --check"
